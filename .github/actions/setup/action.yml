name: Setup
description: >-
  Install the Vite+ toolchain (pinned VP_VERSION — it provides the managed
  Node runtime and the package manager pinned in package.json), restore the
  pnpm store cache, install dependencies with a frozen lockfile, and optionally
  cache the Vite Task results.

inputs:
  cache-task:
    description: Cache the Vite Task results across runs of this job.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install Vite+ (pinned)
      run: |
        installer="$(mktemp)"
        trap 'rm -f "$installer"' EXIT
        # Pin the installer source as well as the CLI version; vite.plus changes independently.
        curl -fsSL https://raw.githubusercontent.com/voidzero-dev/vite-plus/b2d15e3899dcc8adedfd45d98de9d30046a624f4/packages/cli/install.sh -o "$installer"
        echo '3dd88cedb6d9b2665c305eda5413971417c8f183a819386148131b66a2cc6b2e  '"$installer" | shasum -a 256 -c -
        VP_VERSION=0.3.0 VP_NODE_MANAGER=yes bash "$installer"
        # The installer does not touch PATH, so expose its bin dir (vp + managed
        # node/npm/corepack) to later steps.
        echo "$HOME/.local/share/vite-plus/bin" >> "$GITHUB_PATH"
        # pnpm comes from the pinned `packageManager` field via corepack, not
        # from the installer. Create the shims in the same bin dir (GITHUB_PATH
        # above picks them up in every later step, including this composite's).
        "$HOME/.local/share/vite-plus/bin/corepack" enable \
          --install-directory "$HOME/.local/share/vite-plus/bin"
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      shell: bash
    - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ~/.local/share/pnpm/store
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-
    - run: vp install --frozen-lockfile
      shell: bash
    # `actions/cache` restores here and saves in its own post step, so no job
    # needs a matching save step.
    - name: Cache Vite Task results
      if: ${{ inputs.cache-task == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        # Vite Task reads Vitest's result metadata. Restore it too so a fresh
        # runner does not invalidate test tasks because that metadata is missing.
        path: |
          node_modules/.vite/task-cache
          node_modules/.vite/vitest
          apps/*/node_modules/.vite/vitest
          packages/*/node_modules/.vite/vitest
          infra/node_modules/.vite/vitest
        # Task fingerprints already invalidate entries when source/config
        # inputs change. Keep the archive scoped to this job and lockfile so
        # a cache from quality/build cannot be mistaken for a test cache, and
        # dependency changes never fall back to an older dependency graph.
        key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('pnpm-lock.yaml') }}-
