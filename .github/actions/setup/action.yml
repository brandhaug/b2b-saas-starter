name: Setup
description: >-
  Install the Vite+ toolchain (pinned VP_VERSION — it provides the managed
  Node runtime and the package manager pinned in package.json), restore the
  pnpm store cache, install dependencies with a frozen lockfile, and optionally
  cache the Vite Task results.

inputs:
  cache-task:
    description: Cache the Vite Task results across runs of this job.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install Vite+ (pinned)
      run: |
        installer="$(mktemp)"
        trap 'rm -f "$installer"' EXIT
        # The public bootstrap changes independently of the pinned CLI release.
        curl -fsSL https://raw.githubusercontent.com/voidzero-dev/vite-plus/102fe8edad2c45690f24830feee30bfe242817ee/packages/cli/install.sh -o "$installer" # v1.4.0
        echo '6eaf139e16d45849bebc4a7de0dbc2992fd3b3a86a3f37bf7922b685f3a60d9e  '"$installer" | shasum -a 256 -c -
        VP_VERSION=1.4.0 VP_NODE_MANAGER=yes bash "$installer"
        # Expose vp and its managed Node/pnpm shims to later steps. Vite+ 1.4
        # selects pnpm from package.json's packageManager without Corepack.
        echo "$HOME/.local/share/vite-plus/bin" >> "$GITHUB_PATH"
      shell: bash
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/share/pnpm/store
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-
    - run: vp install --frozen-lockfile
      shell: bash
    # `actions/cache` restores here and saves in its own post step, so no job
    # needs a matching save step.
    - name: Cache Vite Task results
      if: ${{ inputs.cache-task == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # Vite Task reads Vitest's result metadata. Restore it too so a fresh
        # runner does not invalidate test tasks because that metadata is missing.
        path: |
          node_modules/.vite/task-cache
          node_modules/.vite/vitest
          apps/*/node_modules/.vite/vitest
          packages/*/node_modules/.vite/vitest
          infra/node_modules/.vite/vitest
        # Task fingerprints already invalidate entries when source/config
        # inputs change. Keep the archive scoped to this job, runtime and lockfile so
        # a cache from quality/build cannot be mistaken for a test cache, and
        # dependency changes never fall back to an older dependency graph.
        key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}-
