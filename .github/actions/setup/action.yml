name: Setup
description: >-
  Install Node (version from .node-version, managed day-to-day by Vite+), the
  package manager pinned in package.json, restore the pnpm and turbo caches,
  and install dependencies with a frozen lockfile.

inputs:
  turbo-key:
    description: >-
      Infix for the turbo cache key. Defaults to the calling job's id, so a
      job named `ci` reads/writes `<os>-turbo-ci-<sha>` — the same semantics
      the jobs had before this composite existed.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
    - uses: pnpm/action-setup@v4
    - uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/.pnpm-store
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-
    - uses: actions/cache@v4
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ inputs.turbo-key || github.job }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ inputs.turbo-key || github.job }}-
          ${{ runner.os }}-turbo-
    - run: pnpm config set store-dir ${{ runner.temp }}/.pnpm-store
      shell: bash
    - run: pnpm install --frozen-lockfile
      shell: bash
