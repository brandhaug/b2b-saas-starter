name: Queue monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operator-queue-monitor
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      vars.OPS_MONITORING_ENABLED == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    environment: operations-monitoring
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check queue backlog without consuming messages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPS_QUEUES: ${{ vars.OPS_QUEUES }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_QUEUE_MONITOR_SLUG: ${{ vars.SENTRY_QUEUE_MONITOR_SLUG }}
        run: node scripts/queue-health.ts
