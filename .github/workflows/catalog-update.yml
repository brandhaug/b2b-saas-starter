name: Catalog Updates

# Dependency updates for the `catalog:` protocol (pnpm catalogs in
# pnpm-workspace.yaml). Groups, branch limits, and ignores live in
# .catalog-updaterc.json at the repo root.
on:
  schedule:
    - cron: '0 6 * * *' # Every day at 06:00 UTC
  push:
    branches:
      - master
    paths:
      - '**/package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

# Rebuilds of open update PRs must run one at a time; queued (not cancelled)
# runs are what let the cascade converge after each merge.
concurrency:
  group: catalog-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The action compares branches against the full history to close
          # stale PRs and rebuild conflicting ones.
          fetch-depth: 0
          token: ${{ secrets.CI_PAT }}
          persist-credentials: false

      # The catalogs are pnpm-defined, so the action installs and audits
      # through pnpm (auto-detected from pnpm-workspace.yaml).
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: brandhaug/catalog-update-action@a0e9ad94e9cb6c053cbbcc32e4db76e030732468 # v1
        with:
          config: '.catalog-updaterc.json'
          dry-run: 'false'
          # A PAT (not the default GITHUB_TOKEN) so the created PRs trigger CI.
          token: ${{ secrets.CI_PAT }}
