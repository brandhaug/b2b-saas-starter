name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Untrusted PR dependencies run in these jobs, so the default write token
# would be theirs too. Only checkout needs the token, and only to read.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run typecheck
      - run: pnpm run lint
      # Includes the coverage ratchet on the application layer: the
      # capabilities `test` script runs with --coverage (thresholds live in
      # packages/capabilities/vitest.config.ts) — fails on decay.
      - run: pnpm run test
      # Fail only on high/critical advisories; lower severities still print.
      # GHSA-jmr9-qjv8-65gv (extract-zip symlink path traversal) has no fixed
      # release upstream (2.0.1 is both latest and vulnerable) — it's pulled
      # in transitively via alchemy's Cloudflare runtime tooling (workerd/
      # browser download step), which runs at deploy time only, not in
      # shipped Worker code. Re-check when extract-zip cuts a patch.
      # pnpm's per-advisory ignore lives in pnpm-workspace.yaml (auditConfig).
      - run: pnpm audit --audit-level=high
      - run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      # Migrate + seed the local D1 so the dev server attaches it (see
      # apps/web/src/lib/cloudflare-workers-shim-dev.ts) and the authenticated
      # sign-in flow test runs instead of skipping.
      - run: pnpm run db:migrate:local
      - run: pnpm run db:seed
      # Playwright's webServer config (apps/web/playwright.config.ts) starts
      # `pnpm run dev` on :3071 itself — no separate server step needed.
      # The webServer startup has flaked on CI (Vite never became ready within
      # its 180s budget, #199's master run and one earlier); that kills the
      # whole run before any test executes, so Playwright's own per-test
      # retries never apply. Retry the run once: a second attempt lands on a
      # warm runner and a fresh server process.
      - name: Run e2e tests
        run: |
          attempts=2
          for attempt in $(seq 1 "$attempts"); do
            if pnpm run test:e2e; then
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "::warning::e2e run failed (attempt $attempt/$attempts) — retrying"
              # A timed-out webServer can leave the dev server or its workerd
              # child holding :3071; clear them so the retry starts clean
              # instead of tripping --strictPort immediately.
              pkill -f 'vite dev' 2>/dev/null || true
              pkill -f workerd 2>/dev/null || true
            fi
          done
          exit 1

  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: [ci, e2e]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          BETTER_AUTH_TRUSTED_ORIGINS: ${{ secrets.BETTER_AUTH_TRUSTED_ORIGINS }}
          # Optional — the SendEmail binding is skipped when unset (alchemy.run.ts).
          CLOUDFLARE_EMAIL_FROM: ${{ secrets.CLOUDFLARE_EMAIL_FROM }}
