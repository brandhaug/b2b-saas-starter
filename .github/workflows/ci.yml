name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Untrusted PR dependencies run in these jobs, so the default write token
# would be theirs too. Only checkout needs the token, and only to read.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  # Superseded PR commits should not consume a runner. Pushes to master keep
  # their run because the production deploy job is part of this workflow.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Test PR readiness helper
        run: bash .github/scripts/pr-readiness.test.sh
      - run: pnpm run typecheck
      - run: pnpm run lint
      # Dead-code regression gate (the `dead-code` step of `pnpm run check`).
      # Fallow is pinned in the workspace catalog so local and CI runs use the
      # same analyzer binary.
      - run: pnpm run dead-code
      # The wrangler configs are generated from infra/bindings.ts. Regenerating
      # them must be a no-op; a hand-edited config (or a spec change nobody
      # re-ran) shows up as a diff here instead of as a worker that drifted
      # from its production deploy.
      - name: Wrangler configs are up to date
        run: |
          pnpm run infra:wrangler
          git diff --exit-code -- apps/*/wrangler.jsonc
      # Includes the coverage ratchet on the application layer: the
      # capabilities `test` script runs with --coverage (thresholds live in
      # packages/capabilities/vitest.config.ts) — fails on decay.
      - run: pnpm run test
      - run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      # Migrate + seed the local D1 so the dev server attaches it (see
      # apps/web/src/lib/cloudflare-workers-shim-dev.ts) and the authenticated
      # sign-in flow test runs instead of skipping.
      - run: pnpm run db:migrate:local
      - run: pnpm run db:seed
      # Playwright's webServer config (apps/web/playwright.config.ts) starts
      # `pnpm run dev` on :3071 itself — no separate server step needed.
      # The webServer startup has flaked on CI (Vite never became ready within
      # its 180s budget, #199's master run and one earlier); that kills the
      # whole run before any test executes, so Playwright's own per-test
      # retries never apply. Retry the run once: a second attempt lands on a
      # warm runner and a fresh server process.
      - name: Run e2e tests
        run: |
          attempts=2
          for attempt in $(seq 1 "$attempts"); do
            if pnpm run test:e2e; then
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "::warning::e2e run failed (attempt $attempt/$attempts) — retrying"
              # Playwright clears its default output directories at the start
              # of the next run. Preserve this attempt before retrying so the
              # artifact contains failures from both outer attempts.
              if [ -d apps/web/test-results ]; then
                cp -R apps/web/test-results "apps/web/test-results-attempt-$attempt"
              fi
              if [ -d apps/web/playwright-report ]; then
                cp -R apps/web/playwright-report "apps/web/playwright-report-attempt-$attempt"
              fi
              # A timed-out webServer can leave the dev server or its workerd
              # child holding :3071; clear them so the retry starts clean
              # instead of tripping --strictPort immediately.
              pkill -f 'vite dev' 2>/dev/null || true
              pkill -f workerd 2>/dev/null || true
            fi
          done
          exit 1
      - name: Upload Playwright results and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_attempt }}
          path: |
            apps/web/test-results
            apps/web/test-results-attempt-*
            apps/web/playwright-report
            apps/web/playwright-report-attempt-*
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: [ci, e2e]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Migrations are squashed routinely, and a squash renames the surviving
      # folder. Alchemy tracks applied migrations by that folder name, so the
      # squashed migration looks pending on a database that already carries
      # the schema and the deploy dies on `CREATE TABLE` ("table `account`
      # already exists"). Baseline first: record migrations whose tables ALL
      # already exist as applied (packages/db/scripts/baseline.ts), so
      # squashes of already-deployed work converge instead of re-running.
      - name: Baseline migration bookkeeping
        run: pnpm run db:baseline:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          BETTER_AUTH_TRUSTED_ORIGINS: ${{ secrets.BETTER_AUTH_TRUSTED_ORIGINS }}
          # A plain value, not a secret: marks the deploy as production, which
          # arms the env gate and email verification. alchemy.run.ts applies
          # the same default to the prod stage; forwarding it here keeps the
          # documented path explicit.
          ENVIRONMENT: production
          # Optional — the SendEmail binding is skipped when unset (alchemy.run.ts).
          CLOUDFLARE_EMAIL_FROM: ${{ secrets.CLOUDFLARE_EMAIL_FROM }}
      # The workers.dev URLs are not known until deploy time: the account's
      # subdomain comes from the Cloudflare API, and the worker names come from
      # stageResourceNames in infra/bindings.ts (`prod` keeps the historical
      # names, so no stage infix). Deriving them here keeps the workflow
      # forkable instead of pinning one deployer's subdomain.
      - name: Resolve deployed URLs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          subdomain="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" |
            jq -er '.result.subdomain')"
          echo "API_URL=https://b2b-saas-starter-api.$subdomain.workers.dev" >> "$GITHUB_ENV"
          echo "WEB_URL=https://b2b-saas-starter-web.$subdomain.workers.dev" >> "$GITHUB_ENV"
      # A green deploy only proves the upload succeeded; the deploy job fails
      # unless the uploaded workers actually serve. Probes the health route on
      # the API worker and the web app root. `--retry` rides out propagation
      # lag right after the upload; `-f --retry-all-errors` makes any HTTP
      # failure (not just transport errors) retry, then fail the job.
      - name: Smoke test the deployment
        run: |
          for url in "$API_URL/health" "$WEB_URL/"; do
            echo "Probing $url"
            curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$url" > /dev/null
          done
