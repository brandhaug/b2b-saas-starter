name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Untrusted PR dependencies run in these jobs, so the default write token
# would be theirs too. Only checkout needs the token, and only to read.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  # Superseded PR commits should not consume a runner. Pushes to master keep
  # their run because the production deploy job is part of this workflow.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-task: true
      - run: vp run typecheck
      - run: vp run lint
      # Dead-code regression gate (the `dead-code` step of `pnpm run check`).
      # Fallow is pinned in the workspace catalog so local and CI runs use the
      # same analyzer binary.
      - run: vp run dead-code
      # The wrangler configs are generated from infra/bindings.ts. Regenerating
      # them must be a no-op; a hand-edited config (or a spec change nobody
      # re-ran) shows up as a diff here instead of as a worker that drifted
      # from its production deploy.
      - name: Wrangler configs are up to date
        run: |
          pnpm run infra:wrangler
          git diff --exit-code -- apps/*/wrangler.jsonc

  # Web and capabilities tests can start immediately instead of waiting for
  # dependency tests. The complementary filters include every workspace,
  # including new packages, exactly once.
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            filter: web
          - name: capabilities
            filter: capabilities
          - name: packages
            filter: '!web'
    name: Tests (${{ matrix.name }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-task: true
      - run: pnpm -C packages/i18n generate
      # Includes the coverage ratchet on the application layer: the
      # capabilities `test` script runs with --coverage (thresholds live in
      # packages/capabilities/vite.config.ts) — fails on decay.
      - name: Run workspace tests
        env:
          TEST_FILTER: ${{ matrix.filter }}
        # The root test script recursively runs workspace tests. Exclude that
        # orchestration script so each package executes in exactly one group.
        run: |
          if [[ "${{ matrix.name }}" == packages ]]; then
            # Each Vitest task has its own workers and D1 proxies. Give each
            # package the runner while web and capabilities run in separate jobs.
            vp run --filter "$TEST_FILTER" --filter '!capabilities' --filter '!b2b-saas-starter' --concurrency-limit 1 --fail-if-no-match test
          else
            vp run --filter "$TEST_FILTER" --filter '!b2b-saas-starter' --fail-if-no-match test
          fi
      - name: Run script tests
        if: ${{ matrix.name == 'packages' }}
        run: pnpm run test:scripts

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-task: true
      - run: vp run build

  # Keep the existing required check name, and fail on skipped/cancelled jobs.
  ci:
    if: ${{ always() }}
    needs: [quality, tests, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required CI jobs succeeded
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$QUALITY_RESULT" != "success" || "$TESTS_RESULT" != "success" || "$BUILD_RESULT" != "success" ]]; then
            echo "CI jobs did not all succeed: quality=$QUALITY_RESULT tests=$TESTS_RESULT build=$BUILD_RESULT"
            exit 1
          fi

  e2e-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm -C apps/web exec playwright install --with-deps --only-shell chromium
      # The compiled preview attaches this local D1 for real authentication.
      - run: pnpm run db:migrate:local
      - run: pnpm run db:seed
      # Each shard builds and serves a compiled app against its own local D1.
      # The wrapper preserves first-attempt evidence if server startup fails.
      - name: Run e2e tests
        run: node .github/scripts/run-check.ts e2e --shard=${{ matrix.shard }}/2
      - name: Upload Playwright results and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            apps/web/test-results
            apps/web/test-results-attempt-*
            apps/web/playwright-report
            apps/web/playwright-report-attempt-*
          if-no-files-found: ignore
          retention-days: 14

  # Preserve the required check name while each shard owns its local D1.
  e2e:
    if: ${{ always() }}
    needs: [e2e-shards]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every E2E shard succeeded
        env:
          RESULT: ${{ needs.e2e-shards.result }}
        run: test "$RESULT" = success

  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: [ci, e2e]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Migrations are squashed routinely, and a squash renames the surviving
      # folder. Alchemy tracks applied migrations by that folder name, so the
      # squashed migration looks pending on a database that already carries
      # the schema and the deploy dies on `CREATE TABLE` ("table `account`
      # already exists"). Baseline first: record migrations whose tables ALL
      # already exist as applied (packages/db/scripts/baseline.ts), so
      # squashes of already-deployed work converge instead of re-running.
      - name: Baseline migration bookkeeping
        run: pnpm run db:baseline:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          BETTER_AUTH_TRUSTED_ORIGINS: ${{ secrets.BETTER_AUTH_TRUSTED_ORIGINS }}
          # A plain value, not a secret: marks the deploy as production, which
          # arms the env gate and email verification. alchemy.run.ts applies
          # the same default to the prod stage; forwarding it here keeps the
          # documented path explicit.
          ENVIRONMENT: production
          # Deployment identity, the way preview.yml stamps it: every wide
          # event and span carries the commit that produced the worker.
          GIT_COMMIT_SHA: ${{ github.sha }}
          SERVICE_VERSION: ${{ vars.SERVICE_VERSION || github.sha }}
          # Optional — the SendEmail binding is skipped when unset (alchemy.run.ts).
          CLOUDFLARE_EMAIL_FROM: ${{ secrets.CLOUDFLARE_EMAIL_FROM }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          MAINTENANCE_MODE: ${{ vars.MAINTENANCE_MODE }}
          SECURITY_EVIDENCE_URL: ${{ vars.SECURITY_EVIDENCE_URL }}
          SECURITY_EVIDENCE_TOKEN: ${{ secrets.SECURITY_EVIDENCE_TOKEN }}
          # Every remaining optional provider var packages/env/src/server.ts
          # lists, split the way that file classifies them: secret keys come
          # from `secrets`, plain keys from `vars`. An unset one resolves to
          # the empty string, which alchemy.run.ts drops from the worker env
          # entirely — the provider stays inactive instead of half-configured.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID_TEAM: ${{ vars.STRIPE_PRICE_ID_TEAM }}
          STRIPE_PRICE_ID_ENTERPRISE: ${{ vars.STRIPE_PRICE_ID_ENTERPRISE }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL_ID: ${{ vars.OPENAI_MODEL_ID }}
          WORKERS_AI_ENABLED: ${{ vars.WORKERS_AI_ENABLED }}
          # GitHub refuses to store a secret or variable whose name starts
          # with `GITHUB_`, so the GitHub sign-in credentials live under an
          # `OAUTH_` prefix and are mapped back to the names the worker reads.
          GITHUB_CLIENT_ID: ${{ vars.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          MCP_RESOURCE_URL: ${{ vars.MCP_RESOURCE_URL }}
          MCP_OAUTH_ISSUER: ${{ vars.MCP_OAUTH_ISSUER }}
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          SUPPORT_HELPDESK_URL: ${{ vars.SUPPORT_HELPDESK_URL }}
          SUPPORT_HELP_CENTER_URL: ${{ vars.SUPPORT_HELP_CENTER_URL }}
          # Workspace data export (ADR 0055): a deploy-time switch, not a
          # bucket name — alchemy names the bucket per stage.
          WORKSPACE_EXPORTS_ENABLED: ${{ vars.WORKSPACE_EXPORTS_ENABLED }}
          # Retention (docs/retention.md): the `environment` object the
          # approval artifact prints, applied as repository/environment
          # variables. Without a matching approval the worker stays in preview
          # mode, so an unset value cannot delete anything.
          RETENTION_CLEANUP_ENABLED: ${{ vars.RETENTION_CLEANUP_ENABLED }}
          RETENTION_RECOVERY_VERIFIED: ${{ vars.RETENTION_RECOVERY_VERIFIED }}
          RETENTION_AUDIT_DAYS: ${{ vars.RETENTION_AUDIT_DAYS }}
          RETENTION_NOTIFICATION_DAYS: ${{ vars.RETENTION_NOTIFICATION_DAYS }}
          RETENTION_INVITATION_DAYS: ${{ vars.RETENTION_INVITATION_DAYS }}
          RETENTION_TOKEN_DAYS: ${{ vars.RETENTION_TOKEN_DAYS }}
          RETENTION_EXPORT_DAYS: ${{ vars.RETENTION_EXPORT_DAYS }}
          RETENTION_BILLING_DAYS: ${{ vars.RETENTION_BILLING_DAYS }}
          RETENTION_EMAIL_DAYS: ${{ vars.RETENTION_EMAIL_DAYS }}
          RETENTION_UNRESOLVED_EMAIL_DAYS: ${{ vars.RETENTION_UNRESOLVED_EMAIL_DAYS }}
          RETENTION_BATCH_SIZE: ${{ vars.RETENTION_BATCH_SIZE }}
          RETENTION_WORK_BUDGET: ${{ vars.RETENTION_WORK_BUDGET }}
          RETENTION_POLICY_APPROVAL_DIGEST: ${{ vars.RETENTION_POLICY_APPROVAL_DIGEST }}
          RETENTION_PREVIEW_DIGEST: ${{ vars.RETENTION_PREVIEW_DIGEST }}
          RETENTION_RECOVERY_EVIDENCE: ${{ vars.RETENTION_RECOVERY_EVIDENCE }}
          RETENTION_POLICY_VERSION: ${{ vars.RETENTION_POLICY_VERSION }}
          RETENTION_POLICY_TARGET: ${{ vars.RETENTION_POLICY_TARGET }}
      # The workers.dev URLs are not known until deploy time: the account's
      # subdomain comes from the Cloudflare API, and the worker names come from
      # stageResourceNames in infra/bindings.ts. Deriving them here keeps the
      # workflow forkable instead of pinning one deployer's subdomain.
      - name: Resolve deployed URLs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_STAGE: prod
        run: node .github/scripts/preview-urls.ts
      # A green deploy only proves the upload succeeded; the deploy job fails
      # unless the uploaded workers actually serve. The probe retries the API
      # health route and the web app root to ride out propagation lag right
      # after the upload, then fails the job.
      - name: Smoke test the deployment
        run: node .github/scripts/smoke-deployment.ts
