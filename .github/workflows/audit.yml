name: Audit

# AC-12: require the `audit` job in the default-branch ruleset.
# Setup and verification: docs/dependency-security.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Mondays 09:00 UTC.
    - cron: '0 9 * * 1'

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Vite+ Node runtime
        run: |
          curl -fsSL https://vite.plus | VP_VERSION=0.3.0 VP_NODE_MANAGER=yes bash
          echo "$HOME/.local/share/vite-plus/bin" >> "$GITHUB_PATH"
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.74.0
          cache: false
      - name: Verify native Trivy exceptions (AC-12.2, AC-12.3)
        run: node --test .github/scripts/trivy.test.ts
        env:
          TRIVY_BINARY: trivy
      # Exceptions take effect only after review and merge into the trusted base.
      # Workflow edit protection requires the settings in docs/dependency-security.md.
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event.pull_request.base.ref == github.event.repository.default_branch && github.event.pull_request.base.sha) || github.event.repository.default_branch }}
          path: .audit-policy-base
          persist-credentials: false
      - name: Audit dependencies (AC-12.1)
        run: |
          echo "Trusted exception revision: $(git -C .audit-policy-base rev-parse HEAD)"
          audit_input="$(mktemp -d)"
          cp pnpm-lock.yaml "$audit_input/pnpm-lock.yaml"
          audit_ignore="$RUNNER_TEMP/trivy-ignore.yaml"
          if [ -f .audit-policy-base/.trivyignore.yaml ]; then
            cp .audit-policy-base/.trivyignore.yaml "$audit_ignore"
          else
            # The initial base predates this policy; no exceptions apply.
            echo 'vulnerabilities: []' > "$audit_ignore"
          fi
          trivy fs --config /dev/null --scanners vuln --pkg-types library \
            --include-dev-deps --severity HIGH,CRITICAL --exit-code 1 \
            --ignorefile "$audit_ignore" --format template \
            --template '@.github/trivy-report.tpl' --quiet \
            "$audit_input" 2> "$RUNNER_TEMP/trivy-error.log" || {
              echo 'Audit failed: resolve the findings above or diagnose Trivy/database availability locally. See docs/dependency-security.md.'
              exit 1
            }
