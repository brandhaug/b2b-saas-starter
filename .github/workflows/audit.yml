name: Audit

# Require the `audit` job in the default-branch ruleset.
# Setup and verification: docs/dependency-security.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Mondays 09:00 UTC.
    - cron: '0 9 * * 1'

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'
          GITLEAKS_VERSION: 8.24.3
      - name: Verify secret detection with synthetic fixtures
        run: vp test run .github/scripts/secret-scan.test.ts
        env:
          GITLEAKS_BINARY: gitleaks
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.74.0
        with:
          version: v0.74.0
          cache: false
      - name: Verify native Trivy exceptions
        run: vp test run .github/scripts/trivy.test.ts
        env:
          TRIVY_BINARY: trivy
      # Exceptions take effect only after review and merge into the trusted base.
      # Workflow edit protection requires the settings in docs/dependency-security.md.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ (github.event.pull_request.base.ref == github.event.repository.default_branch && github.event.pull_request.base.sha) || github.event.repository.default_branch }}
          path: .audit-policy-base
          persist-credentials: false
      - name: Audit dependencies
        run: node .github/scripts/run-trivy.ts .audit-policy-base
