name: Audit

# AC-12: require the `audit` job in the default-branch ruleset.
# Setup and verification: docs/dependency-security.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Mondays 09:00 UTC.
    - cron: '0 9 * * 1'

# The registry's bulk-advisories read is the only network dependency; the
# default read token is enough.
permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Verify audit policy cases (AC-12.2, AC-12.3)
        run: node --test .github/scripts/dependency-audit.test.ts .github/scripts/run-dependency-audit.test.ts
      # Read evaluator/policy from the trusted base while scanning PR dependencies.
      # Protecting this workflow from edits also requires operator review settings;
      # that activation step is explicit in docs/dependency-security.md.
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event.pull_request.base.ref == github.event.repository.default_branch && github.event.pull_request.base.sha) || github.event.repository.default_branch }}
          path: .audit-policy-base
          persist-credentials: false
      # Includes production, development and optional dependencies. The trusted
      # evaluator retries registry failures; bootstrap makes one native attempt.
      - name: Audit dependencies
        run: |
          audit_revision="$(git -C .audit-policy-base rev-parse HEAD)"
          [[ "$audit_revision" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "Trusted audit revision: $audit_revision"
          node .github/scripts/run-dependency-audit.ts .audit-policy-base
