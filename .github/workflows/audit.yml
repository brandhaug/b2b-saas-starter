name: Audit

# AC-12: require the `audit` job in the default-branch ruleset.
# Setup and verification: docs/dependency-security.md.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Mondays 09:00 UTC.
    - cron: '0 9 * * 1'

# The registry's bulk-advisories read is the only network dependency; the
# default read token is enough.
permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Verify audit policy cases (AC-12.2, AC-12.3)
        run: node --test .github/scripts/dependency-audit.test.ts
      # Includes production, development and optional dependencies. Registry
      # failures retry; actionable findings fail immediately unless excepted.
      - name: Audit dependencies
        run: node .github/scripts/dependency-audit.ts
