name: Preview

# One ephemeral Alchemy stage per pull request (ADR 0065). `opened` /
# `synchronize` / `reopened` deploy the stage `pr-<number>` — its own D1,
# queues, and three Workers — seed the Seed Workspace into it, and report the
# URLs through GitHub's Deployments API: the PR timeline links the web Worker,
# the run summary lists all three URLs, and no notification email goes out (a
# PR comment would email every participant on creation). `closed` destroys the
# stage and marks its deployments inactive.
# Production deploys are unchanged (ci.yml, ADR 0019).
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Repository secrets are exposed to this workflow, so it must never run PR
# code from a fork: every job checks `head.repo.full_name == github.repository`.
# Dependabot runs see a separate (empty) secret set and are skipped too.
permissions:
  contents: read
  deployments: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  # A newer push cancels the in-flight deploy of the same PR; a close never
  # gets cancelled, so the stage is always torn down.
  cancel-in-progress: ${{ github.event.action != 'closed' }}

env:
  ALCHEMY_STAGE: pr-${{ github.event.pull_request.number }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  # A preview-only secret, distinct from the `production` environment's.
  BETTER_AUTH_SECRET: ${{ secrets.PREVIEW_BETTER_AUTH_SECRET }}
  GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
  SERVICE_VERSION: pr-${{ github.event.pull_request.number }}

jobs:
  deploy:
    name: Deploy preview stage
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Resolve preview URLs
        id: urls
        run: ./.github/scripts/preview-urls.sh
      # Same squash-rename guard as the production deploy in ci.yml: a
      # long-lived PR's stage database records pre-squash migration names.
      # On a fresh stage database this is a no-op.
      - name: Baseline migration bookkeeping
        run: pnpm run db:baseline:stage
      # Alchemy applies packages/db/migrations to the stage's D1 as part of
      # the deploy (D1.Database `migrations`), so no separate migrate step.
      - name: Deploy the stage
        run: pnpm run deploy:stage
      # The deployed D1 starts empty; the seed makes the preview show the Seed
      # Workspace (starter-lab) with the documented demo credentials.
      - name: Seed the Seed Workspace
        run: pnpm run db:seed:stage
      - name: Smoke test the preview
        run: |
          for url in "$API_URL/health" "$WEB_URL/"; do
            echo "Probing $url"
            curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$url" > /dev/null
          done
      - name: Report the deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Preview stage \`$ALCHEMY_STAGE\`"
            echo
            echo '| Worker | URL |'
            echo '| --- | --- |'
            echo "| web | $WEB_URL |"
            echo "| api | $API_URL/health |"
            echo "| background | $BACKGROUND_URL |"
            echo
            echo "Deployed \`$GIT_COMMIT_SHA\`. The stage has its own D1 seeded with the Seed Workspace (\`starter-lab\`; demo sign-in in \`docs/setup.md\`). Env-gated providers (Turnstile, Stripe, Sentry, PostHog, email, AI) are off. The stage is destroyed when this PR closes."
          } >> "$GITHUB_STEP_SUMMARY"
          ./.github/scripts/preview-status.sh deployed

  destroy:
    name: Destroy preview stage
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge ref is gone once a PR merges; the head commit is not.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup
      # alchemy.run.ts resolves the stage's URLs at module scope even on
      # destroy, so the same inputs are needed here.
      - name: Resolve preview URLs
        run: ./.github/scripts/preview-urls.sh
      - name: Destroy the stage
        run: pnpm run destroy:stage
      - name: Mark the stage's deployments inactive
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/preview-status.sh destroyed
