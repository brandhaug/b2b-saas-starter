packages:
  - apps/*
  - infra
  - packages/*

# Build scripts pnpm may run (the esbuild/workerd/msgpackr binaries are needed
# at runtime). core-js' postinstall is only a funding notice — not allowed.
allowBuilds:
  core-js: false
  core-js-pure: false
  esbuild: true
  msgpackr-extract: true
  workerd: true

auditConfig:
  ignoreGhsas:
    # GHSA-jmr9-qjv8-65gv (extract-zip symlink path traversal) has no fixed
    # release upstream (2.0.1 is both latest and vulnerable) — pulled in
    # transitively via alchemy's Cloudflare runtime tooling, which runs at
    # deploy time only, not in shipped Worker code. Re-check when extract-zip
    # cuts a patch.
    - GHSA-jmr9-qjv8-65gv

