packages:
  - apps/*
  - infra
  - packages/*

# Build scripts pnpm may run (the esbuild/workerd/msgpackr binaries are needed
# at runtime). core-js' postinstall is only a funding notice — not allowed.
allowBuilds:
  core-js: false
  core-js-pure: false
  esbuild: true
  msgpackr-extract: true
  workerd: true

